name: Backend CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build, Test, and Verify
    runs-on: ubuntu-latest

    # ==========================================
    # SERVICES
    # ==========================================
    # Spin up a real MySQL database to verify Flyway migrations
    # and run integration tests against a live DB environment.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: doctor_appointment_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # 1. Checkout Source
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # 3. Cache Maven dependencies automatically
          cache: 'maven'

      # 4. Build Project
      - name: Compile Project
        run: mvn clean compile -B

      # 5. Run Unit Tests
      - name: Run Unit Tests
        # Runs Surefire plugin (default for mvn test)
        run: mvn test -B

      # 6. Run Integration Tests & 8. Verify Flyway
      - name: Run Integration Tests & Verify Flyway Migrations
        # Runs Failsafe plugin (mvn verify).
        # We skip unit tests here since they already ran above.
        # Starting the Spring Context in these tests triggers Flyway
        # to execute V1__create_tables.sql against the MySQL service above,
        # perfectly verifying the SQL syntax and constraints.
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_USERNAME: root
          DB_PASSWORD: root
        run: mvn verify -B -Dsurefire.skip=true

      # 7. Build Docker Image
      - name: Build Docker Image
        run: docker build -t healthcare/doctor-appointment-backend:${{ github.sha }} .

      # 9. Upload Build Artifacts
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctor-appointment-api-artifact
          path: target/*.jar
          retention-days: 7
